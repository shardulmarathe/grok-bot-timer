<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grok Bot Timer</title>
    <meta
      name="description"
      content="A quiet Grok Bot timer. Set a duration, count up, or wait for an alarm."
    />
    <link id="favicon" rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Grok Bot" />
  </head>
  <body>
    <div id="world" data-bots="0" data-landed="0" data-air="0"></div>
    <div id="confetti"></div>
    <main class="ui">
      <header class="top">
        <div class="mark" aria-label="SpaceXAI">
          <svg viewBox="0 0 214 32" role="img" aria-label="SpaceXAI">
            <circle class="mark-plate" cx="16" cy="16" r="15.5" />
            <circle cx="16" cy="16" r="13" fill="#0A0A0A" />
            <g transform="translate(16 14.6) rotate(15)" fill="#FFFFFF">
              <rect x="-5.4" y="-3.3" width="3.2" height="8.2" rx="1.6" />
              <rect x="2.2" y="-3.3" width="3.2" height="8.2" rx="1.6" />
            </g>
            <text
              x="40"
              y="23"
              fill="currentColor"
              font-family="Inter, sans-serif"
              font-size="20"
              font-weight="700"
              letter-spacing="0.2"
            >
              SpaceXAI
            </text>
          </svg>
        </div>
        <div class="top-actions">
          <button type="button" class="icon" id="sound" aria-pressed="false" aria-label="Sound off">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" />
              <path class="sound-on" d="M16 9.2a4 4 0 0 1 0 5.6M18.2 7a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="icon" id="colors" aria-label="Colors" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.5 4.5 19.5 9.5 9 20H4v-5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
              <path d="M4 20c2.2-1 3.4-2.4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
          </button>
          <button type="button" class="icon" id="notify" aria-pressed="false" aria-label="Notifications off">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 16h12l-1.2-2.2V10a4.8 4.8 0 0 0-9.6 0v3.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
              <path d="M10 16.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6" />
            </svg>
          </button>
          <button type="button" class="icon" id="theme" aria-label="Dark theme" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" fill="currentColor" />
              <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5 5l1.6 1.6M17.4 17.4 19 19M19 5l-1.6 1.6M6.6 17.4 5 19" />
              </g>
            </svg>
          </button>
        </div>
      </header>

      <section class="stage">
        <div class="modes" role="tablist" aria-label="Mode">
          <button type="button" id="mode-timer" data-mode="timer" role="tab" aria-selected="true">Timer</button>
          <button type="button" id="mode-stopwatch" data-mode="stopwatch" role="tab" aria-selected="false">Stopwatch</button>
          <button type="button" id="mode-alarm" data-mode="alarm" role="tab" aria-selected="false">Alarm</button>
        </div>

        <div class="clock-stack" id="clock-cluster">
          <div class="hero-wrap">
            <div class="hero" id="hero"></div>
          </div>
          <p class="digits" id="clock" data-remaining="600" data-face="10:00" tabindex="0">
            <span class="slot">1</span><span class="slot">0</span><span class="colon">:</span><span class="slot">0</span><span class="slot">0</span>
          </p>
          <input id="typed" class="digits-edit" hidden aria-label="Type a duration" autocomplete="off" spellcheck="false" />
          <p class="sub" id="sub">Ends —</p>
          <div id="end-screen" class="finale" hidden>
            <h1 class="end-title" id="end-title">Time's Up</h1>
            <div class="end-actions">
              <button type="button" class="pill primary" id="restart">Restart</button>
              <button type="button" class="pill" id="plus-five">+5 min</button>
              <button type="button" class="pill" id="new-timer">New timer</button>
            </div>
          </div>
        </div>

        <div class="controls">
          <div class="presets timer-only" role="group" aria-label="Presets">
            <button type="button" class="pill" data-preset="60">1m</button>
            <button type="button" class="pill" data-preset="300">5m</button>
            <button type="button" class="pill" data-preset="600">10m</button>
            <button type="button" class="pill" data-preset="1500">25m</button>
            <button type="button" class="pill" data-preset="3600">1h</button>
          </div>
          <form id="alarm-form" class="alarm-only">
            <input id="alarm-time" type="time" value="16:30" aria-label="Alarm time" />
          </form>
          <p class="hint" id="hint" hidden></p>
          <div class="transport">
            <button type="button" class="pill ghost watch-only" id="lap">Lap</button>
            <button type="button" class="pill primary" id="start">Start</button>
          </div>
          <ol id="laps" class="watch-only"></ol>
        </div>
      </section>
    </main>
    <div id="color-sheet" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="color-title">
        <div class="sheet-head">
          <h2 id="color-title">Colors</h2>
          <button type="button" class="pill" id="color-close">Done</button>
        </div>
        <p class="sheet-label">Bot</p>
        <div class="swatches" id="bot-swatches"></div>
        <label class="custom-color">Custom <input id="bot-custom" type="color" value="#0a0a0a" aria-label="Custom bot color" /></label>
        <p class="sheet-label">Fill</p>
        <div class="swatches" id="fill-swatches"></div>
        <label class="custom-color">Custom <input id="fill-custom" type="color" value="#9b6bff" aria-label="Custom fill color" /></label>
        <p class="sheet-label">Background</p>
        <div class="swatches" id="bg-swatches"></div>
        <label class="custom-color">Custom <input id="bg-custom" type="color" value="#ffffff" aria-label="Custom background color" /></label>
        <button type="button" class="pill" id="color-reset">Reset to default</button>
      </div>
    </div>
    <div id="focus-dock" aria-hidden="true">
      <button type="button" class="pill" id="focus-pause">Pause</button>
      <button type="button" class="pill" id="focus-reset">Reset</button>
    </div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
